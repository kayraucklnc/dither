# Local build override.
#
# compose.yml pulls ghcr.io/usetrmnl/terminus:latest, which would ignore every
# source change in this working tree. Compose auto-loads this file, so the three
# services that run app code build from the Dockerfile here instead.
services:
  init-certificates:
    image: dither:local
    build:
      context: .

  web:
    image: dither:local
    build:
      context: .

  worker:
    image: dither:local
    build:
      context: .
