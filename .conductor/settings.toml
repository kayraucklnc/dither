# How a Conductor workspace for this repo runs.
#
# Committed rather than left in `.conductor/settings.local.toml`, so a new
# workspace works for anybody who clones this — not only on the machine where
# somebody once clicked through the settings panel.
#
# There is no `setup` script: `make up` installs dependencies and prepares the
# database itself. The gitignored `.env` arrives via `.worktreeinclude` at the
# repository root, and without it there are no database credentials.
"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
# Concurrent because each workspace serves on a port of its own — see bin/dev.
# They share one database, so several running at once is the point.
run_mode = "concurrent"

[scripts.run.dev]
# `make up` prepares this workspace and prints its URL; `make dev` is the dev
# server itself, which is what makes it a useful long-running script.
command = "make up && make dev"
# Needs Docker, so local only.
available_in = [ "local" ]
default = true
icon = "play"

[scripts.run.check]
command = "make test"
available_in = [ "local" ]
icon = "circle-check"
