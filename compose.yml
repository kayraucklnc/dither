name: "dither"

# Dither: a self-hosted e-ink display server.
#
# Two services. The dashboard and the device API are one Next.js application;
# Postgres holds screens, devices, rules and the answers fetched for them.
#
# Rendering happens in-process: the app launches a headless Chromium, screen-
# shots the composed screen, and dithers it. There is no separate renderer and
# no job queue - a panel wakes every fifteen minutes and asks, which is not a
# workload that needs one.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://${DATABASE_USER}:${DATABASE_PASSWORD}@database:${DATABASE_PORT:-5433}/${DATABASE_NAME}
      DITHER_EXTENSIONS_DIR: /app/extensions
      DITHER_STORAGE_DIR: /data/renders
      API_URI: ${API_URI}
      # Trenord encrypts its journey planner under a passphrase shipped in its
      # own JavaScript. Set this when it rotates, rather than cutting a release.
      TRENORD_PASSPHRASE: ${TRENORD_PASSPHRASE:-}
      NODE_ENV: production
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      # Extensions are read from disk at request time, so a new one appears
      # without a rebuild.
      - ./extensions:/app/extensions:ro
      - renders:/data/renders
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/sources').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  database:
    # Pinned to the major version the existing volume holds. Postgres will not
    # start against a data directory written by a different major, and this
    # volume predates the rename, so it is 18 until somebody dumps and restores.
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "${DATABASE_PORT:-5433}:${DATABASE_PORT:-5433}"
    volumes:
      - database-data:/var/lib/postgresql
    command: -p ${DATABASE_PORT:-5433}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME} -p ${DATABASE_PORT:-5433}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  database-data:
    # The original volume, kept through the rename from terminus to dither so
    # nobody's screens go with the old name.
    name: terminus_database-data
  renders:
