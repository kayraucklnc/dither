# Dither bundled extension.
#
# This file plus template.html.liquid is the whole contract. The pair is also
# a valid zip import, so anything authored here can be shipped to someone else
# and loaded through Extensions -> Import without changes.
#
# See extensions/README.md for the full field reference.

version: "1.0.0"
name: public_transport
label: Public Transport
description: >
  Next departures for a stop. Point it at any transit API that returns JSON;
  map the response in template.html.liquid.

# poll = Dither calls the API on a schedule. The alternative is webhook, where
# the third party posts to us instead.
kind: poll
mode: text
tags:
  - transport

# Every 5 minutes. Units: none, minute, hour, day, week, month.
interval: 5
unit: minute
days: []
last_day_of_month: false
start_at: "2026-01-01T00:00:00Z"

static_body: {}
data: {}

# What this renders before it has ever fetched - not configured yet, API down,
# or you are still evaluating with no hardware. Previews fall back to this and
# label it as sample; a device is never served it. Shape it exactly like the
# real response, so a design that looks right here looks right in the field.
sample:
  source_1:
    departures:
      - when: "2026-01-01T08:12:00+01:00"
        delay: 180
        line: {name: "ICE 1045"}
        destination: {name: "Munchen Hbf"}
        stop: {name: "Berlin Hauptbahnhof"}
      - when: "2026-01-01T08:17:00+01:00"
        delay: 0
        line: {name: "RE 3"}
        destination: {name: "Stralsund Hbf"}
        stop: {name: "Berlin Hauptbahnhof"}
      - when: "2026-01-01T08:24:00+01:00"
        delay: 60
        line: {name: "S7"}
        destination: {name: "Potsdam Hauptbahnhof"}
        stop: {name: "Berlin Hauptbahnhof"}
      - when: "2026-01-01T08:31:00+01:00"
        delay: 0
        line: {name: "IC 2432"}
        destination: {name: "Koln Hbf"}
        stop: {name: "Berlin Hauptbahnhof"}
      - when: "2026-01-01T08:39:00+01:00"
        delay: 0
        line: {name: "RB 21"}
        destination: {name: "Wustermark"}
        stop: {name: "Berlin Hauptbahnhof"}
      - when: "2026-01-01T08:46:00+01:00"
        delay: 300
        line: {name: "ICE 597"}
        destination: {name: "Stuttgart Hbf"}
        stop: {name: "Berlin Hauptbahnhof"}

# Fields become the settings form the extension's owner fills in. Each keyname
# is addressable in templates and in exchange URLs as
# {{ extension.values.<keyname> }} - everything an extension knows about
# itself hangs off the "extension" key.
fields:
  - keyname: api_base
    name: API base URL
    field_type: string
    default: "https://v6.db.transport.rest"
    help_text: Root of the transit API. The default is the free Deutsche Bahn mirror.
    optional: false

  - keyname: stop_id
    name: Stop ID
    field_type: string
    default: "8011160"
    help_text: Provider-specific stop identifier. 8011160 is Berlin Hbf.
    optional: false

  - keyname: results
    name: Departures to show
    field_type: string
    default: "6"
    help_text: How many rows to render. Keep it low; the panel is 800x480.
    optional: true

  - keyname: heading
    name: Heading
    field_type: string
    default: "Departures"
    help_text: Title shown in the top bar.
    optional: true

# Each exchange is one HTTP call. Its parsed response reaches the template as
# {{ source_1 }} - numbered in the order listed here, not merged into
# extension.data. URL, headers and body are all Liquid-rendered, so field
# values can be interpolated.
exchanges:
  - verb: get
    template: "{{ extension.values.api_base }}/stops/{{ extension.values.stop_id }}/departures?results={{ extension.values.results }}&duration=120"
    headers:
      Accept: application/json
    body: {}
