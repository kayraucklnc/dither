# Dither bundled extension: Public Transport.
#
# One extension for every city we support. A "transit" extension has no
# exchanges: the settings name a country, city and provider, and the provider
# knows how to answer - including the time zone, which matters because
# operators quote local wall clock times while this server runs in UTC.
#
# Milan/Trenord is what ships today. Adding Berlin, or a second Milan operator,
# means adding an entry to app/aspects/transit/catalog.rb and a provider beside
# it. This file does not change, and neither does anything a user has already
# set up.

version: "1.0.0"
name: public_transport
label: Public Transport
description: >
  Live departures between two stations, with delays, platforms and service
  alerts. Pick your city and operator in settings.

kind: transit
mode: text
tags:
  - transport

interval: 5
unit: minute
days: []
last_day_of_month: false
start_at: "2026-01-01T00:00:00Z"

static_body: {}
data: {}

# Where the choices come from, and what the chosen operator can actually do.
# Both are resolved in code (lib/fields/sources.ts), so this file never lists
# three hundred stations and never guesses what Trenord supports.
capabilities_from: transit.capabilities

fields:
  - keyname: country
    name: Country
    field_type: select
    options_from: transit.countries
    default: "it"
    optional: false

  - keyname: city
    name: City
    field_type: select
    options_from: transit.cities
    default: "milan"
    help_text: Narrowed by the country above.
    optional: false

  - keyname: provider
    name: Operator
    field_type: select
    options_from: transit.providers
    default: "trenord"
    help_text: Who answers for this city. Different operators support different things.
    optional: false

  - keyname: origin
    name: From
    field_type: search
    options_from: transit.stations
    default: "Milano Cadorna"
    help_text: Start typing a station name.
    optional: false

  - keyname: destination
    name: To
    field_type: search
    options_from: transit.stations
    needs_capability: journey
    default: "Saronno"
    help_text: Leave blank for every departure from the origin, wherever it is going.
    optional: true

  - keyname: lead_time
    name: Time to reach the platform
    field_type: number
    default: 0
    min: 0
    max: 60
    help_text: >
      Minutes it takes you to get there. Departures sooner than this are hidden,
      because you could not catch them.
    optional: true

  - keyname: limit
    name: Departures to show
    field_type: number
    default: 5
    min: 1
    max: 12
    help_text: Keep it low. The whole panel is 800x480.
    optional: true

  - keyname: show_platform
    name: Show the platform
    field_type: boolean
    needs_capability: platforms
    default: true
    optional: true

  - keyname: hide_cancelled
    name: Hide cancelled departures
    field_type: boolean
    default: false
    help_text: Off is usually better - a cancelled train is worth knowing about.
    optional: true

  - keyname: heading
    name: Heading
    field_type: string
    default: ""
    help_text: >
      The line across the top. Left blank it names the route itself - "Milano
      Cadorna to Saronno" - which is usually what you want.
    optional: true

# What a rule may ask this extension about.
# Its designs have a strip at the bottom where another extension's notice
# can appear - a service alert while you are looking at the weather.
accepts_notices: true

# Suggested notices. Adding this as a source on a device offers these with a
# click, so "tell me when there is a service alert" is not a rule anyone has
# to compose by hand.
notices:
  - key: service_alert
    label: Service alert
    icon: alert
    level: urgent
    # A service alert belongs on the departure board when the screen has one.
    placement: source
    text: "{{ transit.alert | default: 'Service alert' }}"
    when:
      fact: alert
      operator: present

  - key: cancelled
    label: Next departure cancelled
    icon: close
    level: urgent
    placement: source
    text: "{{ transit.origin | truncate: 18 }}: next train cancelled"
    when:
      fact: next_cancelled
      operator: is_true

  - key: delayed
    label: Running late
    icon: train
    level: info
    placement: source
    text: "{{ transit.departures[0].line }} +{{ transit.departures[0].delay }} min"
    when:
      fact: next_delay
      operator: gte
      value: 5

facts:
  - key: next_departure_in
    label: Next departure leaves in
    type: duration
    path: transit.departures.0.minutes_until
    unit: minutes

  - key: next_delay
    label: Next departure delay
    type: duration
    path: transit.departures.0.delay
    unit: minutes

  - key: next_cancelled
    label: Next departure cancelled
    type: boolean
    path: transit.departures.0.cancelled

  - key: alert
    label: Service alert
    type: text
    # The headline rather than the title: an operator's bulletin is titled
    # after the noticeboard it came from, so the title is the same generic
    # phrase whatever it happens to say. See lib/transit/trenord/board.ts.
    path: transit.alerts.0.headline

  - key: alert_severity
    label: Service alert severity
    type: text
    path: transit.alerts.0.severity

# Shaped exactly like a real board, so a design that reads well here reads well
# in the field.
