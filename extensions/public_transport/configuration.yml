# Dither bundled extension: Public Transport.
#
# One extension for every city we support. A "transit" extension has no
# exchanges: the settings name a country, city and provider, and the provider
# knows how to answer - including the time zone, which matters because
# operators quote local wall clock times while this server runs in UTC.
#
# Milan/Trenord is what ships today. Adding Berlin, or a second Milan operator,
# means adding an entry to app/aspects/transit/catalog.rb and a provider beside
# it. This file does not change, and neither does anything a user has already
# set up.

version: "1.0.0"
name: public_transport
label: Public Transport
description: >
  Live departures between two stations, with delays, platforms and service
  alerts. Pick your city and operator in settings.

kind: transit
mode: text
tags:
  - transport

interval: 5
unit: minute
days: []
last_day_of_month: false
start_at: "2026-01-01T00:00:00Z"

static_body: {}
data: {}

fields:
  - keyname: country
    name: Country
    field_type: string
    default: "it"
    help_text: Two letter code. Only "it" is supported so far.
    optional: false

  - keyname: city
    name: City
    field_type: string
    default: "milan"
    help_text: City code from the catalog.
    optional: false

  - keyname: provider
    name: Operator
    field_type: string
    default: "trenord"
    help_text: Which operator answers for this city.
    optional: false

  - keyname: origin
    name: From
    field_type: string
    default: "Milano Cadorna"
    help_text: Station name. The settings page offers a search.
    optional: false

  - keyname: destination
    name: To
    field_type: string
    default: "Saronno"
    help_text: Leave blank to show every departure from the origin.
    optional: true

  - keyname: lead_time
    name: Walking time
    field_type: string
    default: "0"
    help_text: Minutes to reach the platform. Departures sooner than this are hidden.
    optional: true

  - keyname: limit
    name: Departures to show
    field_type: string
    default: "5"
    help_text: Keep it low. The panel is 800x480.
    optional: true

  - keyname: show_platform
    name: Show platform
    field_type: string
    default: "true"
    help_text: "true or false."
    optional: true

  - keyname: hide_cancelled
    name: Hide cancelled
    field_type: string
    default: "false"
    help_text: "true or false."
    optional: true

  - keyname: title
    name: Heading
    field_type: string
    default: ""
    help_text: Defaults to "origin to destination".
    optional: true

# Shaped exactly like a real board, so a design that reads well here reads well
# in the field.
sample:
  transit:
    origin: "Milano Cadorna"
    destination: "Saronno"
    provider: "trenord"
    city: "milan"
    country: "it"
    empty: false
    departures:
      - line: "S3"
        number: "24015"
        direction: "Saronno"
        scheduled: "08:12"
        expected: "08:15"
        delay: 3
        delayed: true
        platform: "2"
        arrival: "08:41"
        duration: 29
        changes: 0
        direct: true
        cancelled: false
        live: true
        status: "DELAYED"
      - line: "R14"
        number: "2612"
        direction: "Como Lago"
        scheduled: "08:27"
        expected: "08:27"
        delay: 0
        delayed: false
        platform: "4"
        arrival: "08:55"
        duration: 28
        changes: 0
        direct: true
        cancelled: false
        live: true
        status: "ON TIME"
      - line: "S1"
        number: "24019"
        direction: "Saronno"
        scheduled: "08:42"
        expected: "08:42"
        delay: 0
        delayed: false
        platform: "1"
        arrival: "09:12"
        duration: 30
        changes: 1
        direct: false
        cancelled: false
        live: false
        status: "SCHEDULED"
    alerts:
      - title: "Reduced service"
        description: "Engineering work between Cadorna and Bovisa until 10:00."

exchanges: []
