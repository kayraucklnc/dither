# Dither bundled extension: Clock.
#
# Fetches nothing - it renders the server's clock shifted by an offset. Useful
# on its own, and the simplest worked example of the format: a manifest, a
# template per shape, no exchanges, no connection.
#
# It declares no facts. Anything you would want to branch on about the time is
# already reported by the built-in Time source, so duplicating it here would
# give you two answers to the same question.

version: "1.0.0"
name: clock
label: Clock
description: >
  The time, in three styles: a plain readout, a dated panel, or an analogue
  face. Large enough to read across a room.

kind: static
mode: text
tags:
  - time

interval: 1
unit: none
days: []
last_day_of_month: false
start_at: "2026-01-01T00:00:00Z"

static_body: {}
data: {}
sample: {}

fields:
  - keyname: style
    name: Style
    field_type: select
    default: digital
    options:
      - value: digital
        label: Digital — the time, very large
      - value: dated
        label: Dated — the time with the day beside it
      - value: analogue
        label: Analogue — a drawn face
    optional: false

  - keyname: utc_offset_hours
    name: Hours from UTC
    field_type: string
    default: ""
    help_text: >
      Leave blank to use the time zone in Settings. Fill it in only for a second
      clock showing somewhere else - 2 for Berlin in summer, -4 for New York.
    optional: true

  - keyname: heading
    name: Heading
    field_type: string
    default: ""
    help_text: A label above the time - a city, usually. Blank hides it.
    optional: true

  - keyname: twenty_four_hour
    name: 24-hour clock
    field_type: boolean
    default: true
    optional: true

# Its designs have a strip at the bottom where another extension's notice
# can appear - a service alert while you are looking at the weather.
accepts_notices: true

facts: []
exchanges: []
