# Dither bundled extension: Revenue.
#
# Backed by the real Stripe connection. Link the account once under Connections
# and every revenue widget and trigger uses it; the settings here choose *which
# number* this placement shows, and the style picks how it is drawn.
#
# The split is deliberate. One trip to Stripe answers every question the
# account can be asked - what came in over seven windows, what recurs, how many
# customers, when the next subscriber is due - and it is cached by the account
# rather than by the widget. So six revenue widgets showing six different
# numbers on one screen cost one fetch between them, and adding a seventh
# window costs nothing at all.

version: "2.0.0"
name: revenue
label: Revenue
description: >
  What came in, what recurs, how many customers, and when the next subscriber
  is due. One Stripe account, any number of ways to look at it.

kind: connection
connection: stripe
mode: text
tags:
  - money
  - business

# Stripe is generous but not free: one refresh is a handful of paged list
# calls. Twenty minutes is often enough for a wall, and gentle enough that a
# screen with six revenue widgets on it still only asks three times an hour.
#
# It only *is* one refresh because every field below is marked
# `presentation: true`. An answer is cached by the question that produced it,
# and the question is every setting a widget carries - so without that mark,
# one widget showing MRR and another showing today's takings are two questions
# and two trips to Stripe, for two halves of a payload that already contains
# both. Nothing here changes what is fetched. That is the whole design.
interval: 20
unit: minute
days: []
last_day_of_month: false
start_at: "2026-01-01T00:00:00Z"

static_body: {}
data: {}

# The looks, and the sizes each will be drawn at.
#
# `figure` covers almost the whole grid on purpose: a single number is the one
# thing that reads at any size, so a revenue widget can be dragged to nearly
# any box and still have something honest to draw. The richer designs refuse
# the sizes they would be unreadable at, which is the whole point of declaring
# a range rather than scaling.
designs:
  - template: figure
    label: Figure
    hint: One number, as large as the box allows, with a line under it.
    columns: [2, 12]
    rows: [2, 12]
    nominal: [4, 4]

  - template: trend
    label: Figure and trend
    hint: The number, with the days behind it drawn as bars.
    columns: [4, 12]
    rows: [4, 12]
    nominal: [6, 6]

  - template: ledger
    label: Ledger
    hint: A row per window - today, 24 hours, 15 days, 30 days - and the recurring figures.
    columns: [3, 12]
    rows: [5, 12]
    nominal: [4, 12]

  - template: strip
    label: Strip
    hint: Four figures side by side in a shallow band.
    columns: [6, 12]
    rows: [2, 5]
    nominal: [12, 3]

  - template: graph
    label: Line
    hint: The figure with a drawn line under it - a day by the hour, a month by the day, or this week against last.
    columns: [5, 12]
    rows: [4, 12]
    nominal: [8, 6]

  - template: milestone
    label: Milestone
    hint: How far along you are to the next round number, and how long it will take at the current rate.
    columns: [4, 12]
    rows: [3, 12]
    nominal: [6, 5]

  - template: purchases
    label: Recent payments
    hint: Who just paid, how much and when - the newest one large, the rest as a tape under it.
    columns: [4, 12]
    rows: [3, 12]
    nominal: [6, 6]

  - template: spark
    label: Figure and spark
    hint: One number with a hairline of history beside it, for a box too small for a chart.
    columns: [3, 12]
    rows: [2, 4]
    nominal: [5, 3]

  - template: full
    label: Board
    hint: The headline, the supporting figures, and a month of trading drawn as a line.
    columns: [8, 12]
    rows: [8, 12]
    nominal: [12, 12]

fields:
  # Which accounts, and in what currency. Neither is marked presentational,
  # deliberately: both change the *numbers*, not the drawing of them, and a
  # widget showing one account's takings must never be handed the answer that
  # was fetched for all three. That is worth an extra trip to Stripe.
  - keyname: accounts
    name: Which accounts
    field_type: multiselect
    default: []
    options_from: stripe.accounts
    help_text: >
      Leave every one unticked to add up all of them, which is what most people
      want from more than one key. Tick some to show only those. Accounts in
      different currencies are converted before they are added, at the day's
      rate.
    optional: true

  - keyname: currency
    name: Shown in
    field_type: search
    default: account
    options_from: money.currencies
    help_text: >
      The account's own currency needs no rate behind it and is what Stripe
      would show you. Anything else is converted at the day's published rate,
      and a figure that has been converted is an estimate - the panel says so.
    optional: false

  - keyname: metric
    presentation: true
    name: What to show
    field_type: select
    default: taken
    options:
      - value: taken
        label: Money taken
      - value: mrr
        label: Monthly recurring revenue
      - value: subscribers
        label: How many subscribers
      - value: customers
        label: How many customers
      - value: next_subscriber
        label: When the next subscriber is due
    optional: false

  - keyname: window
    presentation: true
    name: Over what period
    field_type: select
    default: today
    options:
      - value: today
        label: Today
      - value: yesterday
        label: Yesterday
      - value: last_24h
        label: The last 24 hours
      - value: last_7d
        label: The last 7 days
      - value: last_15d
        label: The last 15 days
      - value: last_30d
        label: The last 30 days
      - value: month_to_date
        label: This month so far
      - value: all_time
        label: All time
    help_text: >
      Today resets at local midnight, so it is small at breakfast. The last 24
      hours is always a full day's trading whatever time you look. All time
      reaches as far back as one bounded trip to Stripe can see, and says so
      with a "+" when there is more behind it.
    # Only money has a period. There is no such thing as subscribers over the
    # last seven days, and offering it would be a question with no answer.
    visible_when:
      field: metric
      any_of: [taken]
    optional: false

  - keyname: basis
    presentation: true
    name: Measured how
    field_type: select
    default: forecast
    options:
      - value: forecast
        label: Expected, from the recent signup rate
      - value: renewal
        label: The next scheduled renewal
    help_text: >
      A forecast is a rate, not a promise, and the design says how much history
      it is standing on. A renewal is a date Stripe already holds.
    visible_when:
      field: metric
      any_of: [next_subscriber]
    optional: false

  - keyname: heading
    presentation: true
    name: Heading
    field_type: string
    default: ""
    help_text: Left empty, the design names the figure itself.
    optional: true

  - keyname: compare
    presentation: true
    name: Show the change
    field_type: boolean
    default: true
    help_text: A figure with no direction is a number nobody can act on.
    optional: true

  - keyname: compact_figures
    presentation: true
    name: Shorten large numbers
    field_type: boolean
    default: true
    help_text: 74,120 becomes 74.1k. Turn it off where there is room for every digit.
    optional: true

  - keyname: chart
    presentation: true
    name: What goes behind it
    field_type: select
    default: auto
    options:
      - value: auto
        label: Whatever suits the period
      - value: today
        label: Today, hour by hour
      - value: week
        label: The last seven days
      - value: month
        label: The last thirty days
      - value: pace
        label: This week against last, running totals
    help_text: >
      Running totals are the one comparison that reads across a room: either
      this week's line is above last week's or it is not. The others are what
      came in, when.
    visible_when:
      field: design
      any_of: [trend, graph, full]
    optional: true

  - keyname: line_style
    presentation: true
    name: How the line is drawn
    field_type: select
    default: area
    options:
      - value: line
        label: A line
      - value: area
        label: Filled under
      - value: steps
        label: Stepped
      - value: smooth
        label: Curved
      - value: smooth_area
        label: Curved and filled
    help_text: >
      Filled reads from furthest away and is the right answer on a wall.
      A plain line is better where two periods are drawn on top of each other,
      and stepped is the honest one for daily totals - a day is a block of
      trading, not a point that the days either side slope towards. Curved
      still passes through every figure exactly; only the shape between two of
      them is invented, which is a decoration rather than a claim.
    visible_when:
      field: design
      any_of: [graph, full]
    optional: true

  - keyname: axis
    presentation: true
    name: Show the scale
    field_type: boolean
    default: true
    help_text: >
      The high and the low written on the line, and the ends of the period
      named underneath. Without them a chart is a shape rather than a figure.
    visible_when:
      field: design
      any_of: [graph]
    optional: true

accepts_notices: true

notices:
  - key: failed_payments
    label: Payments failing
    icon: alert
    level: urgent
    text: "{{ revenue.failed_today }} payments failed today"
    when:
      fact: failed_today
      operator: gte
      value: 3

  - key: strong_day
    label: Well ahead of yesterday
    icon: trending-up
    level: info
    text: "Up {{ revenue.change_percent }}% on yesterday"
    when:
      fact: change_percent
      operator: gte
      value: 25

  - key: quiet_day
    label: Nothing taken today
    icon: info
    level: warn
    text: "Nothing has come in today"
    when:
      fact: today
      operator: lte
      value: 0

facts:
  - key: today
    label: Taken today
    type: number
    path: revenue.today
    unit: ""

  - key: last_24h
    label: Taken in the last 24 hours
    type: number
    path: revenue.last_24h
    unit: ""

  - key: last_15d
    label: Taken in the last 15 days
    type: number
    path: revenue.last_15d
    unit: ""

  - key: last_30d
    label: Taken in the last 30 days
    type: number
    path: revenue.last_30d
    unit: ""

  - key: month_to_date
    label: Month to date
    type: number
    path: revenue.month_to_date
    unit: ""

  - key: change_percent
    label: Change on yesterday
    type: number
    path: revenue.change_percent
    unit: percent

  - key: mrr
    label: Monthly recurring revenue
    type: number
    path: revenue.mrr
    unit: ""

  - key: subscribers
    label: Active subscribers
    type: number
    path: revenue.subscribers
    unit: ""

  - key: customers
    label: Customers
    type: number
    path: revenue.customers
    unit: ""

  - key: new_customers
    label: New customers today
    type: number
    path: revenue.new_customers
    unit: ""

  - key: failed_today
    label: Failed payments today
    type: number
    path: revenue.failed_today
    unit: ""

  - key: days_to_next_subscriber
    label: Days until the next subscriber is expected
    type: number
    path: revenue.next_subscriber.in_days
    unit: ""

  - key: days_to_next_renewal
    label: Days until the next renewal
    type: number
    path: revenue.next_renewal.in_days
    unit: ""

