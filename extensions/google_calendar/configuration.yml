# Dither bundled extension: Calendar.
#
# Backed by a Google account linked once under Connections. Settings here choose
# which calendar and how far ahead to look, per placement - so "work calendar,
# next 8 hours" and "family calendar, today" can sit on the same screen.
#
# What changed in version 2 is what the payload *is*. It used to be a list of
# events and a countdown, which is enough to draw "what is next" and nothing
# else. Everything anybody actually wants from a calendar on a wall is a fact
# *about* the list rather than a fact in it: am I in something now, when am I
# next free, how much of today is already spoken for, is anything double-booked,
# what does tomorrow look like. All of that is interval arithmetic, all of it is
# easy to get quietly wrong - two overlapping meetings are not two hours, an
# all-day event is not sixteen hours of busy - so it lives in
# web/src/lib/calendar/day.ts, under test, and this manifest is layout.
#
# One payload answers every question the account can be asked, because an
# answer is cached by the question and the question is the account rather than
# the widget. Six calendar widgets on one screen cost one trip between them,
# and the settings that only choose how a day is *drawn* say so with
# `presentation: true` so that they cannot split that trip in two.
#
# Times are carried as minutes since local midnight as well as as text. That is
# what lets a design work out a countdown at the moment it draws rather than
# trusting one computed at the last fetch - the same problem the clock has, and
# the same answer: `tick` on each design says how often the picture would look
# different, and the server redraws it exactly that often.
#
# The Google provider is still mocked: it answers a plausible, deliberately
# awkward day - a double booking, an all-day event, one declined thing - so the
# screens and the triggers can be designed and tested before the OAuth flow
# exists. Swapping the mock for the real API is one function.

version: "2.0.0"
name: google_calendar
label: Calendar
description: >
  What is next, what the rest of the day looks like, and where the gaps are.
  Links to a Google account once and works on every screen.

kind: connection
connection: google
mode: text
tags:
  - calendar
  - time

interval: 10
unit: minute
days: []
last_day_of_month: false
start_at: "2026-01-01T00:00:00Z"

static_body: {}
data: {}

# The looks, and the sizes each will be drawn at.
#
# `tick` is how often the picture changes with the clock, in seconds. Every
# design here counts down to something, so every one of them declares it: a
# countdown redrawn only when the data moves is a countdown that is wrong by
# however long ago the last fetch was.
designs:
  - template: next
    label: What is next
    hint: One meeting, as large as the box allows, with how long you have.
    columns: [2, 12]
    rows: [2, 12]
    nominal: [6, 5]
    tick: 300

  - template: agenda
    label: Agenda
    hint: The day as a list, with the gaps between things marked.
    columns: [3, 12]
    rows: [4, 12]
    nominal: [5, 12]
    tick: 300

  - template: ribbon
    label: The day
    hint: Every meeting drawn where it falls, so the shape of the day is visible at a glance.
    columns: [3, 8]
    rows: [6, 12]
    nominal: [4, 12]
    tick: 300

  - template: band
    label: Band
    hint: A shallow strip - what is now, what is next, and the day drawn across it.
    columns: [6, 12]
    rows: [2, 5]
    nominal: [12, 4]
    tick: 300

  - template: week
    label: The week
    hint: Seven days, how full each one is, and what starts it.
    columns: [6, 12]
    rows: [3, 10]
    nominal: [12, 6]
    tick: 900

  - template: full
    label: Board
    hint: What is next, the whole day beside it, and what is left of it.
    columns: [8, 12]
    rows: [8, 12]
    nominal: [12, 12]
    tick: 300

fields:
  # Several at once, across as many Google accounts as are linked - work and
  # personal on one panel is the ordinary case, and two overlapping widgets is
  # not how anybody would ask for it. Listed from the accounts themselves
  # rather than written down here: a calendar's id is an address, and typing
  # one from memory is a quiz, not a form.
  - keyname: calendar
    name: Calendars
    field_type: multiselect
    default:
      - primary
    options_from: google.calendars
    help_text: >
      Which calendars, from any linked Google account. Tick more than one and
      they are merged into a single list in time order, each entry marked with
      where it came from.
    optional: false

  # A boundary in a place, not a duration. At 22:00 "the rest of today" is two
  # hours and "the next twelve" is most of tomorrow morning, and only one of
  # those is what somebody meant. It decides what is *fetched*, so it is not a
  # presentation setting however much it reads like one.
  - keyname: range
    name: Show
    field_type: select
    default: today
    options:
      - value: today
        label: The rest of today
      - value: tomorrow
        label: Today and tomorrow
      - value: week
        label: The rest of this week
      - value: month
        label: The rest of this month
      - value: hours
        label: The next few hours
    help_text: How far ahead to fetch. Weeks end where this locale says they do.
    optional: false

  - keyname: horizon_hours
    name: Look ahead
    field_type: number
    default: 12
    min: 1
    max: 72
    help_text: >
      Hours ahead to consider. It is what "what is next" is allowed to reach
      into tomorrow for; the day and week views always show their whole day.
    optional: false
    visible_when:
      field: range
      any_of:
        - hours

  - keyname: hide_declined
    name: Hide declined
    field_type: boolean
    default: true
    help_text: Leave out events you have declined. They are never counted as busy either way.
    optional: true

  # Everything below only changes how the day is drawn, never what is fetched
  # for it - which is what `presentation` says, and what stops a screen with
  # three differently-styled calendar widgets on it asking Google three times.
  - keyname: heading
    name: Heading
    field_type: string
    default: ""
    help_text: Left empty, the design names itself - "Today", or the date.
    presentation: true
    optional: true

  - keyname: show_location
    name: Show where
    field_type: boolean
    default: true
    help_text: Room, address or video link under each meeting.
    presentation: true
    optional: true

  - keyname: show_done
    variants: true
    name: Keep what has already happened
    field_type: boolean
    default: false
    help_text: >
      Off, the day empties as it goes and what is left is at the top. On, the
      whole day stays on screen with the finished part struck through - which
      is the one you want on a wall somebody walks past all day.
    visible_when:
      field: design
      any_of: [agenda, full]
    presentation: true
    optional: true

  - keyname: show_gaps
    variants: true
    name: Mark the gaps
    field_type: boolean
    default: true
    help_text: >
      Says how long the holes between meetings are. Seeing the gaps is most of
      what anybody wants from a day at a glance.
    visible_when:
      field: design
      any_of: [agenda, ribbon, full]
    presentation: true
    optional: true

  - keyname: day_start
    name: The day view starts
    field_type: time
    default: "08:00"
    help_text: >
      Where the drawn day begins. Anything earlier than this stretches it, so
      an eight o'clock start never hides a seven o'clock flight.
    visible_when:
      field: design
      any_of: [ribbon, band, full]
    presentation: true
    optional: true

  - keyname: day_end
    name: and ends
    field_type: time
    default: "20:00"
    presentation: true
    visible_when:
      field: design
      any_of: [ribbon, band, full]
    optional: true

accepts_notices: true

notices:
  - key: meeting_imminent
    label: Meeting about to start
    icon: calendar
    level: urgent
    text: "{{ calendar.next.title | truncate: 28 }} at {{ calendar.next.start }}"
    when:
      fact: next_meeting_in
      operator: lt
      value: 10

  - key: double_booked
    label: Double booked
    icon: alert
    level: warn
    text: "Two things at once today"
    when:
      fact: conflicts_today
      operator: gte
      value: 1

  - key: clear_day
    label: Nothing left today
    icon: calendar-check
    level: info
    text: "Nothing left today"
    when:
      fact: meetings_left
      operator: eq
      value: 0

facts:
  # `until`, not just `path`: `minutes_until` was worked out when Google was
  # asked and stops moving the moment it is stored, so a rule reading it says
  # "in twenty minutes" for as long as the row survives - including after the
  # meeting has been and gone. The instant is what is true; the countdown is
  # taken from it when the question is asked. See lib/facts.
  - key: next_meeting_in
    label: Next meeting starts in
    type: duration
    path: calendar.next.minutes_until
    until: calendar.next.at_epoch
    unit: minutes

  - key: next_meeting_title
    label: Next meeting
    type: text
    path: calendar.next.title
    unit: ""

  - key: next_meeting_location
    label: Next meeting location
    type: text
    path: calendar.next.location
    unit: ""

  - key: next_meeting_is_remote
    label: Next meeting is a video call
    type: boolean
    path: calendar.next.remote
    unit: ""

  - key: next_meeting_at
    label: Next meeting is at
    type: time
    path: calendar.next.start
    unit: ""

  - key: in_a_meeting
    label: In a meeting now
    type: boolean
    path: calendar.now.in_meeting
    unit: ""

  - key: current_meeting_title
    label: In this meeting
    type: text
    path: calendar.current.title
    unit: ""

  - key: minutes_until_free
    label: Out of this meeting in
    type: duration
    path: calendar.current.minutes_left
    until: calendar.current.ends_epoch
    unit: minutes

  - key: meetings_left
    label: Meetings left today
    type: number
    path: calendar.today.remaining
    unit: ""

  - key: meetings_today
    label: Meetings today
    type: number
    path: calendar.today.total
    unit: ""

  - key: busy_minutes_today
    label: Booked today
    type: duration
    path: calendar.today.busy_minutes
    unit: minutes

  - key: day_load
    label: How full today is
    type: number
    path: calendar.today.load_percent
    unit: percent

  - key: conflicts_today
    label: Double bookings today
    type: number
    path: calendar.today.conflicts
    unit: ""

  - key: free_until
    label: Free for
    type: duration
    path: calendar.now.free_minutes
    unit: minutes

  - key: first_meeting_at
    label: First meeting today
    type: time
    path: calendar.today.first_start
    unit: ""

  - key: meetings_tomorrow
    label: Meetings tomorrow
    type: number
    path: calendar.tomorrow.count
    unit: ""

# Stand-in data for previews only, never served to a device. Generated from the
# same code the mocked provider runs, so a design judged here is a design that
# works the moment an account is linked - and deliberately awkward: a double
# booking at a quarter past three, an all-day event that must not read as
# sixteen hours of busy, and a long empty afternoon.
#
# Times are minutes since midnight as well as text, so a preview drawn at any
# hour still counts down correctly against its own clock.
  # One of several feeds failing should not blank the four that still work, but
  # it should be something a rule can notice.
  - key: calendars_unread
    label: Calendars that did not answer
    type: number
    path: calendar.unread
    unit: ""

