# Dither bundled extension: Google Calendar.
#
# The first extension backed by a *connection* rather than a URL: you link a
# Google account once under Connections, and every calendar widget on every
# screen uses it. Settings here choose which calendar and how far ahead to
# look, per placement - so "work calendar, next 8 hours" and "family calendar,
# today" can sit on the same screen.
#
# The Google provider is real. Linking is two steps rather than one, because
# Google will not let an unpublished application ask for calendar access: the
# installation registers its own OAuth client, pastes the two halves of it in
# under Connections, and then goes through Google's own consent screen. See
# docs/google-calendar.md.

version: "1.0.0"
name: google_calendar
label: Calendar
description: >
  What is next in your day, and what is after that. Links to a Google account
  once and works on every screen.

kind: connection
connection: google
mode: text
tags:
  - calendar
  - time

interval: 10
unit: minute
days: []
last_day_of_month: false
start_at: "2026-01-01T00:00:00Z"

static_body: {}
data: {}

# Eight looks, at overlapping sizes, because a calendar is the widget people
# stare at most and one opinion about it is not enough. Where two ranges cover
# the size you drew, the widget picks - that is the "style" in the inspector.
#
# Declaring any means declaring all: the preset ranges only apply to a manifest
# that names none.
designs:
  - template: full
    label: Full screen
    hint: What is next, large, with the rest of the day as a timeline beside it.
    columns: [9, 12]
    rows: [9, 12]
    nominal: [12, 12]

  - template: next_up
    label: Next up
    hint: The one thing, as large as the box allows, and nothing else.
    columns: [4, 12]
    rows: [3, 12]
    nominal: [6, 6]

  - template: agenda
    label: Agenda
    hint: What is on, grouped by day. Wants a range that reaches past today.
    columns: [4, 12]
    rows: [6, 12]
    nominal: [6, 12]

  - template: week
    label: Week
    hint: A column per day, gaps included, for reading the shape of a week.
    columns: [8, 12]
    rows: [5, 12]
    nominal: [12, 8]

  - template: half_width
    label: Half width
    hint: Full height, half the width - the day as a single timeline.
    columns: [4, 8]
    rows: [8, 12]
    nominal: [6, 12]

  - template: third_width
    label: Narrow column
    hint: Full height, narrow. A dense agenda and nothing else.
    columns: [2, 5]
    rows: [8, 12]
    nominal: [3, 12]

  - template: third_height
    label: Wide band
    hint: Full width, shallow. One line, read from across the room.
    columns: [8, 12]
    rows: [2, 5]
    nominal: [12, 4]

  - template: quarter
    label: Corner
    hint: A box in the middle of the range, neither band nor column.
    columns: [4, 8]
    rows: [3, 8]
    nominal: [6, 6]

fields:
  - keyname: calendar
    name: Calendar
    field_type: select
    default: primary
    # Listed from the linked account rather than written down here: a calendar's
    # id is an address, and typing one from memory is a quiz, not a form.
    options_from: google.calendars
    help_text: Which calendar from the linked account.
    optional: false

  # A boundary in a place, not a duration. At 22:00 "the rest of today" is two
  # hours and "the next twelve" is most of tomorrow morning, and only one of
  # those is what somebody meant.
  - keyname: range
    name: Show
    field_type: select
    default: today
    options:
      - value: today
        label: The rest of today
      - value: tomorrow
        label: Today and tomorrow
      - value: week
        label: The rest of this week
      - value: month
        label: The rest of this month
      - value: hours
        label: The next few hours
    help_text: How far ahead the list reaches. Weeks end where this locale says they do.
    optional: false

  - keyname: horizon_hours
    name: Look ahead
    field_type: number
    default: 12
    min: 1
    max: 72
    help_text: Hours ahead to consider. Meetings past this are ignored.
    optional: false
    visible_when:
      field: range
      any_of:
        - hours

  - keyname: heading
    name: Heading
    field_type: string
    default: ""
    help_text: >
      Label above the list. Left blank it names the range - "Today", "This
      week" - which is usually what you would have typed.
    optional: true

  - keyname: hide_declined
    name: Hide declined
    field_type: boolean
    default: true
    help_text: Leave out events you have declined.
    optional: true

  - keyname: show_location
    name: Show location
    field_type: boolean
    default: true
    help_text: Room, address or video link under each meeting.
    optional: true

# Everything below becomes a trigger you can build a rule from. The declared
# type decides which comparisons the editor offers.
# Its designs have a strip at the bottom where another extension's notice
# can appear - a service alert while you are looking at the weather.
accepts_notices: true

notices:
  - key: meeting_imminent
    label: Meeting about to start
    icon: calendar
    level: urgent
    text: "{{ calendar.next.title | truncate: 28 }} at {{ calendar.next.start }}"
    when:
      fact: next_meeting_in
      operator: lt
      value: 10

facts:
  - key: next_meeting_in
    label: Next meeting starts in
    type: duration
    path: calendar.next.minutes_until
    unit: minutes

  - key: next_meeting_title
    label: Next meeting
    type: text
    path: calendar.next.title
    unit: ""

  - key: next_meeting_location
    label: Next meeting location
    type: text
    path: calendar.next.location
    unit: ""

  - key: next_meeting_is_remote
    label: Next meeting is a video call
    type: boolean
    path: calendar.next.remote
    unit: ""

  - key: meetings_today
    label: Meetings left today
    type: number
    path: calendar.remaining_today
    unit: ""

  - key: free_until
    label: Free for
    type: duration
    path: calendar.free_minutes
    unit: minutes

  - key: in_meeting
    label: In a meeting right now
    type: boolean
    path: calendar.in_meeting
    unit: ""

  # All-day entries are kept out of the timeline - they have no start time to
  # place on one - but "am I off today" is still a question worth branching on.
  - key: all_day_today
    label: All-day entries today
    type: number
    path: calendar.all_day_today
    unit: ""

