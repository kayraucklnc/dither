; Dither firmware. Build with pioarduino (Arduino-ESP32 core 3.x):
;   uvx --python 3.13 --from "https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip" pio run -e xiao-epaper-75
; or `make build` / `make image`. Host tests: `make test` (no PlatformIO needed).

[platformio]
default_envs = xiao-epaper-75

[env:xiao-epaper-75]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = seeed_xiao_esp32c3
framework = arduino
board_build.partitions = partitions.csv
board_upload.flash_size = 4MB
monitor_speed = 115200
extra_scripts = pre:scripts/version.py
; -ffp-contract=off: no fused multiply-add, so doubles round after every
; operation as in JavaScript - the simulator and the panel must agree on
; every pixel (the smoothed chart is the sensitive case).
build_flags =
    -ffp-contract=off
    -DDITHER_BOARD=\"xiao-epaper-75\"
    -DCORE_DEBUG_LEVEL=1
    -Wall
