inherit_gem:
  caliber: config/all.yml

plugins: rubocop-sequel

Metrics/AbcSize:
  Exclude:
    - app/aspects/extensions/importers/remote/transformer.rb
    - app/aspects/screens/converters/color.rb
    - app/aspects/screens/converters/monochrome.rb
    - app/aspects/screens/shoter.rb
Metrics/BlockLength:
  Exclude:
    - config/db/migrate/*
    - slices/authentication/feature.rb
    - slices/authentication/middleware.rb
Metrics/CollectionLiteralLength:
  Exclude:
    - app/serializers/device.rb
    - spec/app/contracts/devices/patch_spec.rb
    - spec/app/schemas/devices/upsert_spec.rb
    - spec/app/serializers/device_spec.rb
    - spec/requests/devices_spec.rb
Metrics/CyclomaticComplexity:
  AllowedMethods:
    - battery_voltage_to_percent
    - wifi_percentage
Metrics/MethodLength:
  AllowedMethods:
    - battery_voltage_to_percent
    - cloneable_attributes
    - device_attributes
    - export_attributes
    - liquid_attributes
    - wifi_percentage
  Exclude:
    - app/aspects/screens/converters/color.rb
    - app/aspects/screens/converters/monochrome.rb
    - app/aspects/screens/shoter.rb
    - app/views/helpers.rb
    - config/initializers/universal_logger_patch.rb
Metrics/ParameterLists:
  Exclude:
    # Render context assembly: model, device, and view are all callers' choices.
    - app/aspects/extensions/contextualizer.rb
    - app/aspects/extensions/generator.rb
    - app/aspects/extensions/fetcher/request.rb
    - app/aspects/screens/placeholder.rb
    # Value objects: the parameter list is the shape of the data.
    - app/aspects/transit/board.rb
    - app/aspects/transit/departure.rb
    - app/aspects/transit/settings.rb
    - app/aspects/transit/station.rb
    # Mirrors Trenord's own query string.
    - app/aspects/transit/providers/trenord/client.rb
Naming/VariableNumber:
  AllowedPatterns:
    - md5
RSpec/ExampleLength:
  Exclude:
    - "spec/features/**/*"
RSpec/SpecFilePathFormat:
  CustomTransform:
    Dither: ""
Style/IpAddresses:
  Exclude:
    - spec/**/*
